<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Styles.css">
  <title>Регистрация</title>
</head>
<body>
  <div class="container">
    <h1>Регистрация</h1>
    <form action="ThankYou.html" method="GET">
      <label for="username">Имя пользователя</label>
      <input type="text" id="username" name="username" required>

      <label for="email">Электронная почта</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required>

      <label for="confirm-password">Подтвердите пароль</label>
      <input type="password" id="confirm-password" name="confirm-password" required>

      <label for="dob">Дата рождения</label>
      <input type="date" id="dob" name="dob" max="2023-12-31" required>

      <label>Пол</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male" required> Мужской</label>
        <label><input type="radio" name="gender" value="female" required> Женский</label>
      </div>

      <label for="subscribe">
        <input type="checkbox" id="subscribe" name="subscribe"> Подписаться на новости
      </label>

      <label for="message">Сообщение для администратора</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
  </div>
</body>
</html>
