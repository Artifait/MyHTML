<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивное Сердце</title>
    <style>
        /* Центрирование всего содержимого */
        body, html {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        /* Стиль для сердца */
        .heart {
            width: 150px; 
            height: 150px;
            background-image: url('src/favorites.png'); 
            background-size: cover;
            filter: grayscale(100%); 
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        /* Эффект при наведении */
        .heart:hover {
            transform: scale(1.5); /* Увеличение до 1.5 раза */
            filter: grayscale(0%); /* Убираем черно-белый фильтр */
        }
    </style>
</head>
<body>
    <!-- Сердечко по центру -->
    <div class="heart"></div>
</body>
</html>
